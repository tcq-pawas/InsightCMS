{% extends "companies/base.html" %}
{% load wagtailimages_tags static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<section class="auth-page-section">
  <div class="auth-card">
    <h2>{{ page.heading }}</h2>
    <p class="text-muted">{{ page.subtext }}</p>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-primary">{{ page.submit_button_text }}</button>
    </form>

    <p class="auth-switch-link">{{ page.register_prompt_text }} <a href="{{ register_url }}">{{ page.register_link_text }}</a></p>
  </div>
</section>
{% endblock %}
