<div class="bp-page-header" id="dashboard">
  <div>
    <h1 class="bp-page-title">{{ value.welcome_heading|default:"Dashboard" }}</h1>
    <p class="bp-page-sub">{{ value.welcome_subtext|default:"Welcome back! Here's what's happening with your blog." }}</p>
  </div>
  {% if value.new_post_button_text %}
  <div>
    <a href="{{ value.new_post_button_url|default:'/cms/pages/' }}" class="bp-btn-primary">
      <i class="fa-solid fa-plus me-1"></i> {{ value.new_post_button_text }}
    </a>
  </div>
  {% endif %}
</div>
